[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "palimpsest-pipeline"
version = "0.1.0"
description = "Reproducible ingestion, validation, and publishing pipeline for evidence-backed historical geodata"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.5.5,<2",
  "geopandas>=1.1,<2",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "shapely>=2.1,<3",
  "typer>=0.16,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7"
]

[project.scripts]
history-data = "history_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["history_pipeline"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["history_pipeline"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyarrow.*", "shapely.*"]
ignore_missing_imports = true
