name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.16
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen --extra dev
      - name: Audit Python dependencies
        run: uv audit --frozen
      - name: Check configuration, types, style, and tests
        run: make check
      - name: Confirm generated schemas are current
        run: |
          uv run history-data schemas
          git diff --exit-code -- schemas

  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DATA_BASE: https://data.example.invalid/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check
      - run: npm run build
